<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Lamp Studio</title>
<script src="https://cdn.jsdelivr.net/gh/jankovicsandras/imagetracerjs/imagetracer_v1.2.6.js"></script>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #1a1a1a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0;
  }
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  input[type="file"] {
    color: #fff;
  }
  input[type="file"]::file-selector-button {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  input[type="file"]::file-selector-button:hover {
    background: #444;
  }
  .canvas-wrap {
    position: relative;
    width: 800px;
    height: 800px;
  }
  .canvas-wrap canvas,
  .canvas-wrap svg {
    position: absolute;
    top: 0;
    left: 0;
  }
  canvas {
    background: #0e0e0e;
    border: 1px solid #333;
    display: block;
  }
  #overlay {
    pointer-events: none;
  }
  button {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover {
    background: #444;
  }
  .status {
    color: #ffd700;
    font-size: 13px;
    min-height: 18px;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 13px;
  }
  .controls input[type="range"] {
    width: 320px;
  }
  .controls .value {
    display: inline-block;
    min-width: 32px;
    text-align: right;
    color: #ccc;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <h1>Lamp Studio</h1>
  <div class="toolbar">
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <div class="canvas-wrap">
    <canvas id="canvas" width="800" height="800"></canvas>
    <svg id="overlay" width="800" height="800"></svg>
  </div>
  <div class="controls">
    <label for="threshold">Threshold</label>
    <input type="range" id="threshold" min="0" max="255" value="128">
    <span class="value" id="thresholdValue">128</span>
  </div>
  <div class="controls">
    <label for="widthMm">寬</label>
    <input type="range" id="widthMm" min="30" max="90" value="90" step="1">
    <span class="value"><span id="widthValue">90</span> mm</span>
  </div>
  <div class="controls">
    <label for="heightMm">高</label>
    <input type="range" id="heightMm" min="30" max="90" value="90" step="1">
    <span class="value"><span id="heightValue">90</span> mm</span>
  </div>
  <div class="controls">
    <label for="gapMm">間距</label>
    <input type="range" id="gapMm" min="0" max="5" value="0" step="0.1">
    <span class="value"><span id="gapValue">0.0</span> mm</span>
  </div>
  <div class="controls">
    <button id="vectorize">向量化</button>
    <button id="downloadDxf">下載 DXF</button>
    <span class="status" id="status"></span>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const thresholdSlider = document.getElementById('threshold');
const thresholdValue = document.getElementById('thresholdValue');

let currentImage = null;

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

thresholdSlider.addEventListener('input', () => {
  thresholdValue.textContent = thresholdSlider.value;
  scheduleRender();
});

function render() {
  if (!currentImage) return;
  drawContain(currentImage);
  applyThreshold(parseInt(thresholdSlider.value, 10));
  applyGap(parseFloat(gapSlider.value));
}

function applyGap(gapMm) {
  if (!gapMm || gapMm <= 0) return;
  const widthMm = parseFloat(widthSlider.value);
  const pxPerMm = canvas.width / widthMm;
  const radius = Math.round((gapMm / 2) * pxPerMm);
  if (radius <= 0) return;
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  dilateWhite(imageData, radius);
  ctx.putImageData(imageData, 0, 0);
}

function dilateWhite(imageData, r) {
  const w = imageData.width;
  const h = imageData.height;
  const src = imageData.data;

  const bin = new Uint8Array(w * h);
  for (let i = 0; i < bin.length; i++) {
    bin[i] = src[i * 4] > 127 ? 1 : 0;
  }

  const tmp = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    let count = 0;
    for (let xi = 0; xi <= r && xi < w; xi++) count += bin[row + xi];
    tmp[row] = count > 0 ? 1 : 0;
    for (let x = 1; x < w; x++) {
      const addX = x + r;
      const removeX = x - r - 1;
      if (addX < w) count += bin[row + addX];
      if (removeX >= 0) count -= bin[row + removeX];
      tmp[row + x] = count > 0 ? 1 : 0;
    }
  }

  const out = new Uint8Array(w * h);
  for (let x = 0; x < w; x++) {
    let count = 0;
    for (let yi = 0; yi <= r && yi < h; yi++) count += tmp[yi * w + x];
    out[x] = count > 0 ? 1 : 0;
    for (let y = 1; y < h; y++) {
      const addY = y + r;
      const removeY = y - r - 1;
      if (addY < h) count += tmp[addY * w + x];
      if (removeY >= 0) count -= tmp[removeY * w + x];
      out[y * w + x] = count > 0 ? 1 : 0;
    }
  }

  for (let i = 0; i < out.length; i++) {
    const v = out[i] ? 255 : 0;
    src[i * 4] = src[i * 4 + 1] = src[i * 4 + 2] = v;
  }
}

function drawContain(img) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
  const w = img.width * scale;
  const h = img.height * scale;
  const x = (canvas.width - w) / 2;
  const y = (canvas.height - h) / 2;
  ctx.drawImage(img, x, y, w, h);
}

function applyThreshold(t) {
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    const v = gray > t ? 255 : 0;
    data[i] = data[i + 1] = data[i + 2] = v;
  }
  ctx.putImageData(imageData, 0, 0);
}

const vectorizeBtn = document.getElementById('vectorize');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const SVG_NS = 'http://www.w3.org/2000/svg';

vectorizeBtn.addEventListener('click', () => {
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const tracedata = ImageTracer.imagedataToTracedata(imageData, {
    numberofcolors: 2,
    pathomit: 8
  });

  const paths = [];
  tracedata.layers.forEach((layer, idx) => {
    const c = tracedata.palette[idx];
    const brightness = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
    if (brightness < 128) {
      layer.forEach(p => paths.push(p));
    }
  });

  window.tracedPaths = paths;

  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
  paths.forEach(p => {
    const d = segmentsToPathD(p.segments);
    if (!d) return;
    const el = document.createElementNS(SVG_NS, 'path');
    el.setAttribute('d', d);
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', '#ffd700');
    el.setAttribute('stroke-width', '1');
    overlay.appendChild(el);
  });

  statusEl.textContent = `找到 ${paths.length} 條路徑`;
});

function segmentsToPathD(segments) {
  if (!segments || !segments.length) return '';
  const s0 = segments[0];
  let d = `M ${s0.x1} ${s0.y1}`;
  for (const s of segments) {
    if (s.type === 'Q') {
      d += ` Q ${s.x2} ${s.y2} ${s.x3} ${s.y3}`;
    } else {
      d += ` L ${s.x2} ${s.y2}`;
    }
  }
  d += ' Z';
  return d;
}

const downloadBtn = document.getElementById('downloadDxf');
const widthSlider = document.getElementById('widthMm');
const heightSlider = document.getElementById('heightMm');
const widthValue = document.getElementById('widthValue');
const heightValue = document.getElementById('heightValue');
const gapSlider = document.getElementById('gapMm');
const gapValue = document.getElementById('gapValue');

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

widthSlider.addEventListener('input', () => {
  widthValue.textContent = widthSlider.value;
  scheduleRender();
});
heightSlider.addEventListener('input', () => {
  heightValue.textContent = heightSlider.value;
});
gapSlider.addEventListener('input', () => {
  gapValue.textContent = parseFloat(gapSlider.value).toFixed(1);
  scheduleRender();
});

downloadBtn.addEventListener('click', () => {
  const paths = window.tracedPaths;
  if (!paths || !paths.length) {
    statusEl.textContent = '請先按「向量化」';
    return;
  }
  const widthMm = parseFloat(widthSlider.value);
  const heightMm = parseFloat(heightSlider.value);
  const dxf = buildDXF(paths, canvas.width, canvas.height, widthMm, heightMm);
  // Use data: URL instead of blob: URL — blob: downloads are silently
  // blocked by Chrome / Safari when the page is opened via file:// protocol.
  const a = document.createElement('a');
  a.href = "data:application/dxf;charset=utf-8," + encodeURIComponent(dxf);
  a.download = 'lamp-pattern.dxf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  statusEl.textContent = `已輸出 ${widthMm} × ${heightMm} mm`;
});

function segmentsToPoints(segments) {
  if (!segments || !segments.length) return [];
  const pts = [{ x: segments[0].x1, y: segments[0].y1 }];
  for (const s of segments) {
    if (s.type === 'Q') {
      const steps = 6;
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const u = 1 - t;
        const x = u * u * s.x1 + 2 * u * t * s.x2 + t * t * s.x3;
        const y = u * u * s.y1 + 2 * u * t * s.y2 + t * t * s.y3;
        pts.push({ x, y });
      }
    } else {
      pts.push({ x: s.x2, y: s.y2 });
    }
  }
  return pts;
}

function buildDXF(paths, canvasWidth, canvasHeight, widthMm, heightMm) {
  const sx = widthMm / canvasWidth;
  const sy = heightMm / canvasHeight;
  const out = ['0', 'SECTION', '2', 'ENTITIES'];
  for (const p of paths) {
    const pts = segmentsToPoints(p.segments);
    if (pts.length < 2) continue;
    out.push('0', 'POLYLINE', '8', 'PATTERN', '66', '1', '70', '1');
    for (const pt of pts) {
      const x = (pt.x * sx).toFixed(4);
      const y = ((canvasHeight - pt.y) * sy).toFixed(4);
      out.push('0', 'VERTEX', '8', 'PATTERN', '10', x, '20', y, '30', '0');
    }
    out.push('0', 'SEQEND');
  }
  out.push('0', 'ENDSEC', '0', 'EOF');
  return out.join('\n');
}
</script>
</body>
</html>
